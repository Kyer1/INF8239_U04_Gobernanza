priority_harm: "Falso negativo: un caso real de riesgo que el sistema no prioriza y espera más en la cola. Afecta más al grupo G1 (recall 0.653 frente a 0.791 en G2)."
primary_metric: "Recall global y brecha de recall entre grupos (protected_group); como métrica secundaria, brecha de FPR."
tolerance: "Recall global >= 0.68 y brechas de recall y FPR <= 0.16 (puertas de governance.yml). Subgrupos con menos de 20 casos en prueba no se interpretan."
evidence: "Prueba temporal (160 casos, G1=101, G2=59). Regresión logística umbral 0.50: recall 0.717, brecha recall 0.138 (IC95% bootstrap 0.012-0.325), brecha FPR 0.125 (IC95% 0.009-0.403). Árbol: brecha recall 0.181 y FPR 0.168, no pasa. Archivos: reports/lab12/*/global_metrics.json, reports/ex07/model_comparison.csv y gap_confidence_intervals.csv."
limitation: "Datos sintéticos y muestra de prueba pequeña: los IC de las brechas son amplios y su límite superior supera 0.16, por lo que no puedo afirmar que la brecha real esté dentro de la tolerancia. Cinco de ocho subgrupos grupo x edad tienen menos de 20 casos. La diferencia en tasa de selección refleja en parte tasas base distintas (G1 0.485, G2 0.729)."
recommendation: "LIMITAR: usar la regresión logística sin age_band (umbral 0.50) solo para ordenar la cola de revisión humana; todos los casos se siguen revisando, el modelo no excluye ninguno. Monitoreo mensual del recall de G1, apelación disponible, retiro y vuelta a FIFO si se incumplen las puertas. No usar el árbol."
