purpose: "Ordenar los casos territoriales sintéticos recibidos para que el equipo técnico revise primero los de mayor riesgo estimado de incidente. El sistema prioriza, no decide."
assisted_decision: "Orden de la cola de revisión técnica humana. Ningún caso se cierra, se descarta ni recibe intervención por la puntuación del modelo."
users: "Analistas técnicos de revisión territorial (operadores), con supervisión del responsable institucional."
affected_population: "Personas y hogares vinculados a los casos recibidos, incluidos los grupos G1 y G2 y todas las franjas de edad. Un caso real no priorizado puede esperar más y sufrir un daño evitable."
owner: "Responsable institucional del programa de revisión territorial (Product Owner del DSS)."
non_predictive_alternative: "Revisar todos los casos por orden de llegada (FIFO) con la misma lista de verificación. No omite casos reales, pero exige más horas de revisión y retrasa la atención de los casos urgentes."
out_of_scope_use: "Intervención automática, decisión de elegibilidad, declaración de emergencia, sanciones, perfilamiento de personas o cualquier uso sobre poblaciones reales con estos datos sintéticos."
withdrawal_condition: "Retirar el modelo y volver a FIFO si el recall global baja de 0.68, si la brecha de recall o de FPR entre grupos supera 0.16 en dos revisiones mensuales seguidas, si se detecta uso fuera de alcance o si un incidente grave se atribuye al orden propuesto."
appeal_mechanism: "Cualquier operador o persona afectada puede solicitar revisión manual inmediata de un caso, sin depender de la puntuación. La solicitud se registra con fecha y respuesta en un máximo de 5 días hábiles, y el responsable institucional revisa los casos apelados cada mes."
