incident_id: "INC-2026-11-01-SIM"
severity_rule: "Grave: la puerta de calidad devuelve STOP o se incumple una condición de retiro. Moderado: REVIEW. Leve: solo avisos de deriva."
containment_owner: "Institutional Owner (Accountable en Incident response); ejecuta el ML Engineer."
communication_internal: "Aviso al Product Owner, Data Scientist y operadores en menos de 24 horas: el orden de la cola vuelve a FIFO y se suspende la puntuación."
communication_affected: "Aviso a los representantes de las personas afectadas en 5 días hábiles: qué pasó, qué casos de zona Norte se revisan de nuevo y cómo apelar."
root_cause_hypothesis: "La migración del formulario de zona Norte no trasladó el campo previous_incidents y los valores ausentes se guardaron como 0."
corrective_actions: "1) Revisar de nuevo, con prioridad, los casos de zona Norte recibidos desde 2026-11-01 (Operator, 3 días). 2) Corregir la migración y recargar el campo (Data Engineer, 7 días). 3) Añadir al contrato de datos la regla de que un valor ausente no se codifica como 0 y el control de proporción de ceros por zona (Data Engineer, 10 días). 4) Repetir auditoría y puertas antes de reactivar el modelo (Data Scientist, 10 días)."
postmortem_owner: "Data Scientist (R) con aprobación del Institutional Owner (A)"
postmortem_due: "10 días hábiles después de la contención"
lessons: "Las métricas con etiquetas detectan el problema tarde; el control de calidad sin etiquetas (proporción de ceros por zona) lo detecta el mismo mes. Las ventanas mensuales son pequeñas para medir brechas: las alertas de equidad se confirman con el acumulado."
